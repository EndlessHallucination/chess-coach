<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Coach</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/main.js" defer></script>
</head>
<body>

<div id="app">

  <!-- ── Board column ── -->
  <div id="board-col">

    <div id="status-bar">
      <div id="turn-dot"></div>
      <span id="status">White to move</span>
    </div>

    <div id="board-wrap">
      <div id="myBoard"></div>
    </div>

    <div id="playing-as-row">
      <label for="playingAs">Playing as</label>
      <select id="playingAs">
        <option value="both">Both sides</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
    </div>

    <div id="btn-row">
      <button id="resetBtn">Reset</button>
      <button id="flipBtn">Flip</button>
      <button id="hintBtn">Get Hint</button>
    </div>

  </div>

  <!-- ── Coach column ── -->
  <div id="coach-col">

    <!-- Hint section -->
    <div class="coach-section">
      <div class="section-label">Hint</div>
      <div class="hint-grid">

        <div class="hint-field">
          <span class="hint-field-label">Hint</span>
          <span class="hint-field-value" id="hintText">—</span>
        </div>

        <div class="hint-field">
          <span class="hint-field-label">Concepts</span>
          <span class="hint-field-value" id="hintConcepts">—</span>
        </div>

        <div class="hint-field" id="hintBestMoveField">
          <span class="hint-field-label">Best Move</span>
          <span class="hint-field-value" id="hintBestMove">—</span>
        </div>

        <div class="hint-field">
          <span class="hint-field-label">Explanation</span>
          <span class="hint-field-value" id="hintExplanation">—</span>
        </div>

      </div>
    </div>

    <!-- Analysis section -->
    <div class="coach-section">
      <div class="section-label">Analysis</div>
      <div class="analysis-section">
        <div id="analysisDisplay">—</div>
        <button id="analyzeBtn">Analyze Last Move</button>
      </div>
    </div>
    <div class="coach-section">
      <div class="section-label">Move History</div>
      <div id="moveHistory"></div>
      <button id="undoBtn">Undo move</button>
    </div>

  </div>

</div>

</body>
</html>
